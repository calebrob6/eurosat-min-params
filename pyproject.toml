[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eurosat-features"
version = "0.1.0"
description = "Fixed spectral and spatial features for EuroSAT patches"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["torch>=2.5"]

[project.optional-dependencies]
io = ["numpy>=1.26", "rasterio>=1.3"]
experiments = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "rasterio>=1.3",
    "matplotlib>=3.8",
]

[project.urls]
Repository = "https://github.com/calebrob6/eurosat-min-params"
Article = "https://geospatialml.com/posts/eurosat-min-params/"

[tool.setuptools.packages.find]
include = ["eurosat_features*"]

[tool.ruff]
fix = true
target-version = "py311"
include = [
    "pyproject.toml",
    "eurosat_features/**/*.py",
    "extract_features.py",
]

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D", "UP", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"
