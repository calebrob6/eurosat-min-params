name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install reference libraries and CPU PyTorch
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-reproduce.txt
          python -m pip install -e ".[io]"
      - name: Run data-free feature and reproduction tests
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONPATH: tests
        run: |
          python -m unittest \
            test_release test_blog_results test_reproduce_all \
            test_figure_statistics test_torch_features test_feature_cli test_article_baselines
      - name: Build the feature package
        run: python -m pip wheel --no-deps --wheel-dir output/wheels .
